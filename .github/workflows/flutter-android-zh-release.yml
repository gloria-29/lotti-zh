name: Flutter Android Chinese Release

# Builds a Simplified-Chinese-localized release APK.
# Uses a fixed self-signed keystore committed to this fork so every build
# has the SAME signing key: users can update the app without uninstalling.

on:
  workflow_dispatch:
  push:
    branches:
      - zh-localization

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-zh:
    name: Build Android (zh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK 28
        run: |
          echo "y" | sudo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # gen-l10n runs automatically during the build (generate: true),
      # but we run it up front to fail fast on any ARB problem.
      - name: Generate localizations (includes app_zh.arb)
        run: flutter gen-l10n

      - name: Create key.properties from committed keystore
        run: |
          {
            echo "storePassword=lotti-zh-2026"
            echo "keyPassword=lotti-zh-2026"
            echo "keyAlias=lotti-zh"
            echo "storeFile=${{ github.workspace }}/android/app/upload-keystore.jks"
          } > android/key.properties

      - name: Generate keystore if not committed
        run: |
          if [ -f android/app/upload-keystore.jks ]; then
            echo "keystore already committed, reusing it (stable signing)."
          else
            echo "keystore not found, generating a new one (signing will be committed for future updates)."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass lotti-zh-2026 -keypass lotti-zh-2026 \
              -alias lotti-zh -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Lotti Chinese, OU=Lotti, O=Lotti, C=CN"
            mkdir -p keystore_export
            cp android/app/upload-keystore.jks keystore_export/
            echo "lotti-zh-2026" > keystore_export/keystore_password.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keystore
          path: keystore_export/

      - name: Verify keystore exists
        run: ls -la android/app/upload-keystore.jks

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-zh
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/*-release.apk

      - name: Compute APK SHA256
        run: |
          sha256sum build/app/outputs/flutter-apk/*-release.apk | tee apk-sha256.txt

      - name: Create or update GitHub Release (zh-v1.1.1)
        id: release
        run: |
          gh release create "zh-v1.1.1" --title "Lotti 简体中文汉化版" --generate-notes --target "$GITHUB_SHA" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs to GitHub Release
        run: |
          gh release upload "zh-v1.1.1" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
