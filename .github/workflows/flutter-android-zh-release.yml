name: Flutter Android Chinese Release

# Builds a Simplified-Chinese-localized release APK without requiring any
# repository secrets: a self-signed keystore is generated at build time so
# the APK can be sideloaded directly.

on:
  workflow_dispatch:
  push:
    branches:
      - zh-localization

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-zh:
    name: Build Android (zh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK 28
        run: |
          echo "y" | sudo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations (includes app_zh.arb)
        run: flutter gen-l10n

      - name: Generate self-signed keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -storepass lotti-zh-2026 -keypass lotti-zh-2026 \
            -alias lotti-zh -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Lotti Chinese, OU=Lotti, O=Lotti, C=CN"

      - name: Create key.properties
        run: |
          {
            echo "storePassword=lotti-zh-2026"
            echo "keyPassword=lotti-zh-2026"
            echo "keyAlias=lotti-zh"
            echo "storeFile=${{ github.workspace }}/android/app/upload-keystore.jks"
          } > android/key.properties

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-zh
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/*-release.apk

      - name: Create GitHub Release
        run: gh release create -p --generate-notes --target "$GITHUB_SHA" "zh-v$(grep '^version:' pubspec.yaml | awk '{print $2}')" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs to GitHub Release
        run: |
          gh release upload "zh-v$(grep '^version:' pubspec.yaml | awk '{print $2}')" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
